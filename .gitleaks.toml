# gitleaks configuration: the default rules, plus allowlists for findings
# that are not secrets. Each allowlist names the exact files and only the
# rules that fire there, so anything else in those files is still reported.

[extend]
useDefault = true

[[allowlists]]
description = "Documentation examples: curl with the default admin:admin login of the local development and demo containers."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)docs/Installation/demo\-environment\.md$''',
  '''(^|/)docs/features/metrics\-and\-health\.md$''',
]

[[allowlists]]
description = "Archived task notes: curl checks with the default admin:admin login of the local development container."
targetRules = ["curl-auth-user"]
paths = [
  '''(^|/)openspec/changes/archive/2026\-07\-23\-theming\-capability\-api/tasks\.md$''',
  '''(^|/)openspec/changes/archive/2026\-07\-25\-theme\-switchable\-iconography/tasks\.md$''',
]

[[allowlists]]
description = "Parity catalogue: the key field is a capability slug (m365-...), not a credential."
targetRules = ["generic-api-key"]
paths = [
  '''(^|/)openspec/parity/capabilities\.json$''',
]
