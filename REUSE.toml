# REUSE / SPDX declaration for thematiq.
#
# `quality / REUSE compliance` (fsfe/reuse-action@v5, shared quality.yml) was
# red on every run. The repo carried SPDX headers on its hand-written source —
# 250 of 3682 tracked files — but LICENSES/ held only the Etalab text, so every
# `SPDX-License-Identifier: EUPL-1.2`, `AGPL-3.0-or-later` and `MIT` in the tree
# pointed at a licence text that was not there, and the ~3430 files carrying no
# header at all (l10n JSON, openspec specs, the 1038 DSFR icon SVGs, docs,
# fixtures, lockfiles) had no licensing information by REUSE's definition.
#
# Headers on those 3430 files would be the other fix, and it is the wrong one:
# `l10n/*.json` is machine-generated and an SPDX comment is not valid JSON, the
# icon SVGs are regenerated wholesale by `scripts/build-icons.js` from the
# upstream DSFR package, and lockfiles are rewritten by the package managers.
# The blanket below is what the specification is for.
version = 1
SPDX-PackageName = "thematiq"
SPDX-PackageSupplier = "Conduction B.V. <info@conduction.nl>"
SPDX-PackageDownloadLocation = "https://github.com/ConductionNL/thematiq"

# Repo-wide default.
#
# `precedence = "closest"` means a file's OWN header always wins over this
# entry — including the files carrying Nextcloud code, which are
# AGPL-3.0-or-later (`.editorconfig`, `css/playground-guest.css` and its source
# `scripts/sources/nextcloud-guest.css`), and the La Suite Cunningham token
# dump `scripts/sources/lasuite-deployed-cunningham-tokens.css`, which is MIT.
#
# It also fills in half a header: a file that declares a licence but no
# copyright takes the missing half from here rather than counting as
# non-compliant.
[[annotations]]
path = "**"
precedence = "closest"
SPDX-FileCopyrightText = "2026 Conduction B.V. <info@conduction.nl>"
SPDX-License-Identifier = "EUPL-1.2"

# The bundled French-government assets from @gouvfr/dsfr, which are NOT ours to
# licence as EUPL: the Marianne typeface (bundled behind the admin
# acknowledgement gate — see MARIANNE-LICENCE.md and AGREEMENT-MARIANNE.md for
# the FR-State usage restriction that sits on top of this licence) and the DSFR
# icon pack that `scripts/build-icons.js` materializes.
#
# `precedence = "override"` rather than "closest" because these are binary and
# generated files that carry no header of their own and must not silently
# inherit the blanket above. It is also what makes `etalab-2.0` a USED licence;
# without it REUSE reports the licence text as unused.
[[annotations]]
path = [
    "css/systems/lasuite/fonts/marianne/**",
    "img/icons/dsfr/**",
]
precedence = "override"
SPDX-FileCopyrightText = "2021 Gouvernement français (https://github.com/GouvernementFR/dsfr)"
SPDX-License-Identifier = "etalab-2.0"

# The bundled SIL Open Font License 1.1 typefaces, which are NOT ours to
# licence as EUPL (#898). Without these entries the blanket above labelled the
# binaries EUPL-1.2. Each font directory also ships an OFL.txt with the
# copyright notice and the licence text, because the OFL requires both to travel
# with the fonts; tests/vitest/fontLicences.spec.js asserts both halves.
#
# `precedence = "override"` for the same reason as the DSFR entry: binary files
# with no header of their own must not inherit the blanket. The copyright lines
# are the ones in each family's upstream licence file.
[[annotations]]
path = [
    "css/fonts/fira-sans-*",
    "css/systems/nldesign/fonts/fira-sans-*",
    "css/systems/nldesign/fonts/OFL.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2012-2015 The Mozilla Foundation and Telefonica S.A. (https://github.com/mozilla/Fira)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "css/fonts/figtree-*",
    "css/systems/nldesign/fonts/figtree-*",
]
precedence = "override"
SPDX-FileCopyrightText = "2022 The Figtree Project Authors (https://github.com/erikdkennedy/figtree)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = "css/fonts/ibm-plex-mono-*"
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp. with Reserved Font Name \"Plex\" (https://github.com/IBM/plex)"
SPDX-License-Identifier = "OFL-1.1"

# The OFL families self-hosted for the shipped token sets that NAME them
# (openspec/changes/honest-token-set-coverage). Each is listed in the FAMILIES
# table of scripts/build-fonts.js with the same copyright line, and that script's
# --check mode refuses a binary no table claims, so a font cannot arrive here
# without its holder being recorded.
#
# A family we may NOT redistribute is not here and not bundled: Avenir, DIN,
# Bolder, Karbon, Sofia Pro, greycliff-cf, neue-haas-grotesk, RijksoverheidSans,
# Calibri and the Monotype "Droid Sans W01" webfont stay an administrator upload,
# declared per set in token-sets.json.
[[annotations]]
path = [
    "css/fonts/open-sans-*",
    "css/systems/nldesign/fonts/open-sans-*",
]
precedence = "override"
SPDX-FileCopyrightText = "2020 The Open Sans Project Authors (https://github.com/googlefonts/opensans)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "css/fonts/lato-*",
    "css/systems/nldesign/fonts/lato-*",
]
precedence = "override"
SPDX-FileCopyrightText = "2010-2011 by tyPoland Lukasz Dziedzic (team@latofonts.com) with Reserved Font Name \"Lato\""
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "css/fonts/roboto-*",
    "css/systems/nldesign/fonts/roboto-*",
]
precedence = "override"
SPDX-FileCopyrightText = "2011 The Roboto Project Authors (https://github.com/googlefonts/roboto-classic)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "css/fonts/ibm-plex-sans-*",
    "css/systems/nldesign/fonts/ibm-plex-sans-*",
]
precedence = "override"
SPDX-FileCopyrightText = "2017 IBM Corp. with Reserved Font Name \"Plex\" (https://github.com/IBM/plex)"
SPDX-License-Identifier = "OFL-1.1"

# Intel Clear Sans is Apache-2.0, not OFL, so it travels with
# LICENSES/Apache-2.0.txt and its own APACHE-2.0.txt beside the binaries.
[[annotations]]
path = [
    "css/fonts/clear-sans-*",
    "css/systems/nldesign/fonts/clear-sans-*",
    "css/fonts/APACHE-2.0.txt",
    "css/systems/nldesign/fonts/APACHE-2.0.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2012 Intel Corporation (https://github.com/intel/clear-sans)"
SPDX-License-Identifier = "Apache-2.0"

# Each OFL.txt carries the notices of every OFL family in its own directory;
# scripts/build-fonts.js generates those lines, so the list cannot go stale.
[[annotations]]
path = [
    "css/fonts/OFL.txt",
    "css/systems/nldesign/fonts/OFL.txt",
]
precedence = "override"
SPDX-FileCopyrightText = [
    "2012-2015 The Mozilla Foundation and Telefonica S.A. (https://github.com/mozilla/Fira)",
    "2010-2020 Adobe (http://www.adobe.com/), with Reserved Font Name 'Source'",
    "2020 The Open Sans Project Authors (https://github.com/googlefonts/opensans)",
    "2010-2011 by tyPoland Lukasz Dziedzic (team@latofonts.com) with Reserved Font Name \"Lato\"",
    "2011 The Roboto Project Authors (https://github.com/googlefonts/roboto-classic)",
    "2017 IBM Corp. with Reserved Font Name \"Plex\" (https://github.com/IBM/plex)",
    "2022 The Figtree Project Authors (https://github.com/erikdkennedy/figtree)",
]
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = [
    "css/systems/lasuite/fonts/inter-*",
    "css/systems/lasuite/fonts/OFL.txt",
    "css/systems/summer-breeze/fonts/Inter-*",
    "css/systems/summer-breeze/fonts/OFL.txt",
]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

# Prose that QUOTES an SPDX tag rather than carrying one.
#
# These files discuss the licensing invariant in running text: "every PHP
# file carries `SPDX-License-Identifier: EUPL-1.2`" and the like. REUSE reads
# the tag out of the sentence, cannot parse the rest of the sentence as a
# licence expression, and the file counts as having declared its licensing
# badly rather than not at all — so the blanket above never reaches it.
#
# `precedence = "override"` makes this entry win over what the tool thinks it
# found in the text. The alternative is REUSE-IgnoreStart/End comments inside
# the prose, which would split a Requirement paragraph and an archived spec in
# two to satisfy a linter.
[[annotations]]
path = [
    "openspec/specs/claim-accuracy/spec.md",
    "openspec/changes/archive/2026-07-07-fix-readiness-claims/specs/claim-accuracy/spec.md",
    "openspec/changes/archive/2026-10-02-beta-surface-alignment/proposal.md",
    "openspec/changes/archive/2026-10-02-beta-surface-alignment/specs/beta-alignment/spec.md",
    "openspec/specs/beta-alignment/spec.md",
    "openspec/parity/capabilities.json",
    "openspec/changes/component-playground/design.md",
]
precedence = "override"
SPDX-FileCopyrightText = "2026 Conduction B.V. <info@conduction.nl>"
SPDX-License-Identifier = "EUPL-1.2"

# Source Sans 3, bundled for the (EXAMPLE) Gemeente token set
# (openspec/changes/example-gemeente-theme, design D3). Binary woff2 files from
# @fontsource/source-sans-3 5.3.0, latin subset. Not ours to licence as EUPL.
[[annotations]]
path = [
    "css/fonts/source-sans-3-*.woff2",
    "css/systems/nldesign/fonts/source-sans-3-*.woff2",
    "css/fonts/source-sans-pro-*.woff2",
    "css/systems/nldesign/fonts/source-sans-pro-*.woff2",
]
precedence = "override"
SPDX-FileCopyrightText = "2010-2020 Adobe (http://www.adobe.com/), with Reserved Font Name 'Source'"
SPDX-License-Identifier = "OFL-1.1"

# The pinned @gemeente-denhaag component and token CSS, vendored verbatim so
# scripts/generate-denhaag-bridge.mjs runs offline and reproducibly
# (openspec/changes/denhaag-component-tokens). EUPL-1.2, as published.
[[annotations]]
path = "scripts/sources/denhaag/*.css"
precedence = "override"
SPDX-FileCopyrightText = "Gemeente Den Haag"
SPDX-License-Identifier = "EUPL-1.2"

# The Den Haag token set and the brand files it is generated from. These are
# COMPOSITE: the palette, the component mapping and the ramp are Den Haag's own
# values, read off the vendored CSS above, while the role layer around them and
# the --nldesign-* semantic layer are ours. Both halves are EUPL-1.2, so the
# licence identifier the blanket entry gives them was already right; the
# copyright line was not, because it named only us. Two holders, one licence.
#
# `precedence = "override"` for the same reason the entry above uses it: these
# files carry no SPDX header of their own (the CSS is written by
# scripts/generate-brand-set.mjs and an SPDX comment is not valid JSON), so
# without this they silently inherit a copyright line that leaves Den Haag out.
#
# css/tokens/rotterdam.css has the same shape with no entry of its own. That
# predates this change and is not fixed here.
[[annotations]]
path = [
    "css/tokens/denhaag.css",
    "css/tokens/dark/denhaag.css",
    "scripts/brands/denhaag.json",
    "scripts/brands/denhaag.components.json",
]
precedence = "override"
SPDX-FileCopyrightText = [
    "2026 Conduction B.V. <info@conduction.nl>",
    "Gemeente Den Haag",
]
SPDX-License-Identifier = "EUPL-1.2"
