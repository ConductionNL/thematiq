name: Sync NL Design System Tokens

on:
  schedule:
    # Run nightly at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-tokens:
    runs-on: ubuntu-latest
    # Observed n=11 (2026): max 1.9 min, median 0.3 min. Bound loosely at 15.
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Generate against development, where token work lands; main is the
          # release branch and lags by a release, so a sync built on it went
          # stale and conflicted (#526).
          ref: development

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clone NL Design System themes
        id: clone_themes
        run: |
          git clone --depth 1 https://github.com/nl-design-system/themes.git /tmp/themes
          echo "sha=$(git -C /tmp/themes rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run token generation script
        run: |
          node scripts/generate-tokens.mjs /tmp/themes ${{ steps.clone_themes.outputs.sha }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-progress --no-interaction

      - name: Regenerate dark-mode variants
        # Any upstream token change regenerates its dark variant in the same
        # PR (openspec/specs/dark-mode/spec.md, tasks.md#task-2.4). --force
        # ensures a source-hash-unchanged set is not silently left stale.
        run: php scripts/generate-dark-variants.php --force

      - name: Check for changes
        id: changes
        run: |
          git add css/tokens/ css/tokens/dark/ token-sets.json
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing PR
        if: steps.changes.outputs.has_changes == 'true'
        id: existing_pr
        run: |
          PR_NUMBER=$(gh pr list --head chore/sync-nldesign-tokens --json number --jq '.[0].number // empty')
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update sync branch
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/sync-nldesign-tokens
          git commit -m "chore: sync NL Design System tokens from upstream

          Auto-generated from nl-design-system/themes repository.
          See: https://github.com/nl-design-system/themes"
          git push -f origin chore/sync-nldesign-tokens

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true' && steps.existing_pr.outputs.pr_number == ''
        run: |
          gh pr create \
            --title "chore: Sync NL Design System tokens" \
            --body "## Summary
          - Auto-synced design tokens from [nl-design-system/themes](https://github.com/nl-design-system/themes)
          - Generated by \`scripts/generate-tokens.mjs\`

          ## Review
          - Check that existing token sets still produce expected output
          - Verify any new organizations are correctly named in \`token-sets.json\`

          ---
          *This PR was automatically created by the nightly token sync workflow.*" \
            --head chore/sync-nldesign-tokens \
            --base development
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update existing PR
        if: steps.changes.outputs.has_changes == 'true' && steps.existing_pr.outputs.pr_number != ''
        run: |
          gh pr comment ${{ steps.existing_pr.outputs.pr_number }} \
            --body "Updated with latest token changes from upstream ($(date -u +'%Y-%m-%d %H:%M UTC'))."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
