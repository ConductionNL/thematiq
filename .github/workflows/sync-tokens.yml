name: Sync NL Design System Tokens

on:
  schedule:
    # Run nightly at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-tokens:
    runs-on: ubuntu-latest
    # Was 15 (n=11, max 1.9 min) for the raw dump. The converter run itself takes
    # seconds; the token-set gate takes about 50 s, and when the first pass fails
    # every converted set is retried on its own (about 30 sets x 50 s).
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Generate against development, where token work lands; main is the
          # release branch and lags by a release, so a sync built on it went
          # stale and conflicted (#526).
          ref: development

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-progress --no-interaction

      - name: Clone NL Design System themes
        id: clone_themes
        run: |
          git clone --depth 1 https://github.com/nl-design-system/themes.git /tmp/themes
          echo "sha=$(git -C /tmp/themes rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Convert upstream themes onto the nldesign vocabulary
        # scripts/sync-upstream-tokens.mjs converts every upstream-managed set
        # through the converter (never a hand-authored one), keeps local
        # overrides, and accepts a set only when scripts/token-set-gate.sh passes
        # with it in: dark variants, contrast report and token reference are
        # regenerated there. It exits non-zero when the gate fails even with
        # every rejected set put back, so no PR is opened from a red tree.
        run: |
          node scripts/sync-upstream-tokens.mjs /tmp/themes ${{ steps.clone_themes.outputs.sha }} --report /tmp/sync-report.md

      - name: Verify the shipped token sets
        # The same tests once more, on exactly the tree that would be committed.
        # A failure here fails the job before any branch or PR is touched.
        run: php vendor/bin/phpunit --no-coverage -c phpunit.token-sets.xml

      - name: Check for changes
        id: changes
        run: |
          git add css/tokens/ token-sets.json tests/Unit/fixtures/token-set-vocabulary-allowlist.json docs/reference/ docs/features/
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing PR
        if: steps.changes.outputs.has_changes == 'true'
        id: existing_pr
        run: |
          PR_NUMBER=$(gh pr list --head chore/sync-nldesign-tokens --json number --jq '.[0].number // empty')
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update sync branch
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/sync-nldesign-tokens
          git commit -m "chore: sync NL Design System tokens from upstream

          Converted from nl-design-system/themes by scripts/sync-upstream-tokens.mjs.
          See: https://github.com/nl-design-system/themes"
          git push -f origin chore/sync-nldesign-tokens

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true' && steps.existing_pr.outputs.pr_number == ''
        run: |
          gh pr create \
            --title "chore: sync NL Design System tokens" \
            --body-file /tmp/sync-report.md \
            --head chore/sync-nldesign-tokens \
            --base development
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update existing PR
        if: steps.changes.outputs.has_changes == 'true' && steps.existing_pr.outputs.pr_number != ''
        run: |
          gh pr edit ${{ steps.existing_pr.outputs.pr_number }} --body-file /tmp/sync-report.md
          gh pr comment ${{ steps.existing_pr.outputs.pr_number }} \
            --body "Updated with the latest conversion from upstream ($(date -u +'%Y-%m-%d %H:%M UTC'))."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
