name: Sync NL Design System Tokens

on:
  schedule:
    # Run nightly at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-themes:
    # Runs upstream's theme builds (third-party code) with a read-only token
    # and no checkout of this repository, and hands only the generated token
    # files to the sync job as an artifact.
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      sha: ${{ steps.clone_themes.outputs.sha }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The themes workspace requires Node ^24.22.3 to build its generated
          # themes.
          node-version: '24'

      - name: Clone NL Design System themes
        id: clone_themes
        run: |
          git clone --depth 1 https://github.com/nl-design-system/themes.git /tmp/themes
          echo "sha=$(git -C /tmp/themes rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build the generated upstream themes
        # Some themes (sittard-geleen, vidar) have no token files: upstream
        # generates them in TypeScript. Install only what those builds need,
        # without lifecycle scripts, and write each theme's
        # tmp/generated.tokens.json for the converter. A build that fails
        # leaves its theme skipped, as it was before, and the others go on.
        working-directory: /tmp/themes
        run: |
          themes=()
          for build in proprietary/*/src/build-theme.mts; do
            [ -f "$build" ] && themes+=("${build%/src/build-theme.mts}")
          done
          if [ "${#themes[@]}" -eq 0 ]; then
            echo "No generated themes upstream."
            exit 0
          fi
          filters=()
          for theme in "${themes[@]}"; do
            filters+=(--filter "./${theme}...")
          done
          corepack enable
          if ! pnpm install --frozen-lockfile --ignore-scripts "${filters[@]}"; then
            echo "::warning::could not install the generated themes' dependencies; the sync skips them"
            exit 0
          fi
          for theme in "${themes[@]}"; do
            if (cd "$theme" && node src/build-theme.mts); then
              echo "built ${theme}"
            else
              echo "::warning::could not build ${theme}; the sync skips it"
            fi
          done

      - name: Collect the generated tokens
        # Staged under their path in the themes checkout, with a file at the
        # root, so the artifact keeps that layout however many themes built.
        working-directory: /tmp/themes
        run: |
          mkdir -p /tmp/generated
          git rev-parse HEAD > /tmp/generated/themes-sha.txt
          for f in proprietary/*/tmp/generated.tokens.json; do
            [ -f "$f" ] && cp --parents "$f" /tmp/generated/
          done
          find /tmp/generated -type f

      - name: Hand the generated tokens to the sync job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generated-themes
          path: /tmp/generated
          retention-days: 1

  sync-tokens:
    needs: build-themes
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    # Was 15 (n=11, max 1.9 min) for the raw dump. The full token-set gate takes
    # about 3.5 min here. When its first pass fails, each of the ~40 converted
    # sets is retried with only the failing tests (about 20 s each), then the
    # full gate runs once more: about 15 min measured locally in total.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Generate against development, where token work lands; main is the
          # release branch and lags by a release, so a sync built on it went
          # stale and conflicted (#526).
          ref: development

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # The same Node as the build-themes job; thematiq's engines allow ^24.
          node-version: '24'

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-progress --no-interaction

      - name: Install Node dependencies
        # The gate runs the vitest specs that read the shipped sets.
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Clone NL Design System themes
        id: clone_themes
        # The same upstream commit the build-themes job built from.
        env:
          THEMES_SHA: ${{ needs.build-themes.outputs.sha }}
        run: |
          git init -q /tmp/themes
          git -C /tmp/themes remote add origin https://github.com/nl-design-system/themes.git
          git -C /tmp/themes fetch -q --depth 1 origin "$THEMES_SHA"
          git -C /tmp/themes checkout -q FETCH_HEAD
          echo "sha=$(git -C /tmp/themes rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Download the generated upstream themes
        # Built by the read-only build-themes job.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: generated-themes
          path: /tmp/generated

      - name: Take the generated upstream themes
        # Only the token files go into the checkout; a theme whose build did
        # not run stays skipped by the converter, as before.
        run: |
          if [ -d /tmp/generated/proprietary ]; then
            cp -r /tmp/generated/proprietary/. /tmp/themes/proprietary/
          fi
          find /tmp/themes/proprietary -path '*/tmp/generated.tokens.json'

      - name: Convert upstream themes onto the nldesign vocabulary
        # scripts/sync-upstream-tokens.mjs converts every upstream-managed set
        # through the converter (never a hand-authored one), keeps local
        # overrides, and accepts a set only when scripts/token-set-gate.sh passes
        # with it in: dark variants, contrast report and token reference are
        # regenerated there. It exits non-zero when the gate fails even with
        # every rejected set put back, so no PR is opened from a red tree.
        run: |
          node scripts/sync-upstream-tokens.mjs /tmp/themes ${{ steps.clone_themes.outputs.sha }} --report /tmp/sync-report.md

      - name: Refresh the fixtures that follow from the shipped sets
        # The golden fixtures and the shell catalogue are recorded over the
        # shipped sets, so a sync that changes a set makes them stale and the
        # unit suite red. This job changes sets and never code, so re-recording
        # every golden only moves the ones that read the sets.
        run: |
          php scripts/generate-shell-catalogue.php > /dev/null
          for test in $(grep -rlE 'THEMATIQ_GOLDEN_RECORD' tests/Unit --include='*Test.php'); do
            THEMATIQ_GOLDEN_RECORD=1 php vendor/bin/phpunit --no-coverage --bootstrap tests/bootstrap.php "$test" > /dev/null
          done

      - name: Verify the shipped token sets
        # The same tests once more, on exactly the tree that would be committed.
        # A failure here fails the job before any branch or PR is touched.
        run: |
          php vendor/bin/phpunit --no-coverage -c phpunit.token-sets.xml
          node scripts/update-coverage-claims.mjs --check
          php vendor/bin/phpunit --no-coverage --bootstrap tests/bootstrap.php tests/Unit/ShellCatalogueTest.php
          php vendor/bin/phpunit --no-coverage --bootstrap tests/bootstrap.php $(grep -rlE 'THEMATIQ_GOLDEN_RECORD' tests/Unit --include='*Test.php')

      - name: Check for changes
        id: changes
        run: |
          git add css/tokens/ css/public-bridge.css token-sets.json tests/Unit/fixtures/token-set-vocabulary-allowlist.json tests/Unit/fixtures/golden/ docs/reference/ docs/features/ README.md project.md
          if git diff --cached --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing PR
        if: steps.changes.outputs.has_changes == 'true'
        id: existing_pr
        run: |
          PR_NUMBER=$(gh pr list --head chore/sync-nldesign-tokens --json number --jq '.[0].number // empty')
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update sync branch
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/sync-nldesign-tokens
          git commit -m "chore: sync NL Design System tokens from upstream

          Converted from nl-design-system/themes by scripts/sync-upstream-tokens.mjs.
          See: https://github.com/nl-design-system/themes"
          git push -f origin chore/sync-nldesign-tokens

      - name: Create pull request
        if: steps.changes.outputs.has_changes == 'true' && steps.existing_pr.outputs.pr_number == ''
        run: |
          gh pr create \
            --title "chore: sync NL Design System tokens" \
            --body-file /tmp/sync-report.md \
            --head chore/sync-nldesign-tokens \
            --base development
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update existing PR
        if: steps.changes.outputs.has_changes == 'true' && steps.existing_pr.outputs.pr_number != ''
        run: |
          gh pr edit ${{ steps.existing_pr.outputs.pr_number }} --body-file /tmp/sync-report.md
          gh pr comment ${{ steps.existing_pr.outputs.pr_number }} \
            --body "Updated with the latest conversion from upstream ($(date -u +'%Y-%m-%d %H:%M UTC'))."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
